<style>
  /* ---------- Piel "Evolución": franja navy + lista por preguntas ---------- */
  body{background:var(--bg);-webkit-font-smoothing:antialiased}
  .band{background:var(--topbar-gradient);color:#fff;padding:2rem 1.25rem 4.6rem;border-radius:0 0 28px 28px}
  .band-in{max-width:720px;margin:0 auto}
  .band .brandline{font-weight:800;font-size:.9rem;letter-spacing:.02em;color:#c9d3ee;margin:0 0 .6rem}
  .band .brandline .dot{color:var(--accent)}
  .band h1{font-size:2.1rem;line-height:1.1;margin:0 0 .5rem;font-weight:800;letter-spacing:-.02em}
  .band p{color:#c9d3ee;font-size:1rem;margin:0;max-width:520px}
  .wrap{max-width:720px;margin:-3.2rem auto 0;padding:0 1rem 3rem;position:relative}

  /* "Continúa donde lo dejaste" (solo si la persona pidió recordar sus datos) */
  .continue{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--accent);border-radius:20px;
    padding:14px 16px;margin-bottom:1rem;text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
  .continue .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .continue small{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a6400}
  .continue b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .continue .cv{font-size:1.2rem;font-weight:800;color:var(--primary);white-space:nowrap}
  .continue:hover{box-shadow:var(--shadow-lg)}
  .hidden{display:none!important}

  .apps-section{background:#fff;border:1px solid #e3e8f1;border-radius:20px;box-shadow:var(--shadow);padding:.4rem 0;margin-bottom:1rem}
  .sec-head{padding:.8rem 1.1rem .3rem}
  .sec-head h2{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin:0}
  .app-row{display:flex;align-items:center;gap:14px;padding:12px 1.1rem;min-height:64px;text-decoration:none;color:var(--text);
    border-top:1px solid #eef1f6;transition:background .15s}
  .sec-head + .app-row{border-top:none}
  .app-row:hover{background:#f7f9fd}
  .app-icon{width:48px;height:48px;flex-shrink:0}
  .app-row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .app-row .q{font-weight:700;font-size:1rem;line-height:1.3}
  .app-row .meta{font-size:.8rem;color:var(--text-muted)}
  .app-row .meta .accent{color:#8a6400;font-weight:700}
  .app-row .chev{color:#9aa6b8;font-size:1.3rem;font-weight:700;flex-shrink:0}
  .foot{text-align:center;color:var(--text-muted);font-size:.8rem;margin:1.4rem 0 0}
  @media(min-width:700px){.band{padding:2.8rem 1.5rem 5rem}.band h1{font-size:2.6rem}}
</style>

  var T = {
    es: {
      title: "AstroTools · Tu suite de calculadoras",
      headline: "¿Qué quieres saber hoy?",
      subtitle: "Calculadoras financieras gratis, en cristiano. Tus datos no salen de tu móvil.",
      q: { nomina: "¿Cuánto cobraré neto al mes?", casa: "¿Qué piso me puedo permitir?", rentabilidad: "¿Cuánto me ha rendido una inversión?", forecast: "¿Cuánto tendré cuando me jubile?", ahorro: "Empieza a invertir, paso a paso" },

      subtitle: "Free money calculators in plain language. Your data never leaves your device.",
      q: { nomina: "How much will I take home each month?", casa: "What home can I afford?", rentabilidad: "How well did my investment do?", forecast: "How much will I have when I retire?", ahorro: "Start investing, step by step" },

      sec: { calc: "Calculators · a result in seconds", learn: "Guides · at your pace" },
      cont: "Pick up where you left off", foot: "Guidance tools, not financial advice."
    }

  function accentName(name){
    return name.indexOf("Astro") === 0 ? 'Astro<span class="accent">' + name.slice(5) + '</span>' : name;
  }

  /* Agrupación de apps en el hub. Cualquier app de brand.js que no figure aquí
     se añade automáticamente a "Calculadoras" (red de seguridad). */
  var GROUPS = [
    { key: "calc",  ids: ["casa", "nomina", "rentabilidad", "forecast"] },
    { key: "learn", ids: ["ahorro"] }
  ];
  // apps de brand.js sin grupo asignado → a Calculadoras (una sola vez)
  (function () {
    var assigned = {}; GROUPS.forEach(function (g) { g.ids.forEach(function (id) { assigned[id] = 1; }); });
    cfg.apps.forEach(function (a) { if (!assigned[a.id]) GROUPS[0].ids.push(a.id); });
  })();

  // Una fila por app: la pregunta que resuelve (en lenguaje llano) + marca y esfuerzo
  function row(a, t) {
    if (!a) return "";
    return '<a class="app-row" href="' + a.href + '">' +
             (ICONS[a.id] || "") +
             '<span class="txt"><span class="q">' + ((t.q && t.q[a.id]) || a.tagline) + '</span>' +
             '<span class="meta">' + accentName(a.name) + ((t.meta && t.meta[a.id]) ? ' · ' + t.meta[a.id] : '') + '</span></span>' +
             '<span class="chev" aria-hidden="true">›</span>' +
           '</a>';
  }

  // "Continúa donde lo dejaste": lo escribe shared/ux.js solo si la persona marcó "Recordar en este móvil"
  function renderContinue(t, byId) {
    var box = document.getElementById("continue"), last = null;
    try { last = JSON.parse(localStorage.getItem("astro:last") || "null"); } catch (e) {}
    var app = last && byId[last.app];
    if (!app) { box.classList.add("hidden"); return; }
    box.href = app.href;
    document.getElementById("contLbl").textContent = t.cont;
    document.getElementById("contTxt").textContent = last.label || app.name;
    document.getElementById("contVal").textContent = last.value || "";
    box.classList.remove("hidden");
  }

  function render(l) {
    var t = T[l] || T.es;
    document.title = t.title;
    document.getElementById("headline").textContent = t.headline;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("foot").textContent = t.foot;

    var byId = {}; cfg.apps.forEach(function (a) { byId[a.id] = a; });
    renderContinue(t, byId);

    document.getElementById("apps").innerHTML = GROUPS.map(function (g) {
      var rows = g.ids.map(function (id) { return row(byId[id], t); }).join("");
      if (!rows) return "";
      return '<section class="apps-section">' +
               '<div class="sec-head"><h2>' + t.sec[g.key] + '</h2></div>' + rows +
             '</section>';
    }).join("");
  }

  window.setLang = function (l) {
    if (!T[l]) l = "es";
    document.documentElement.lang = l;
    render(l);
  };

  render("es");
</script>
</body>
