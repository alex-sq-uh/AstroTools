<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroTools · Tu suite de calculadoras</title>
<meta name="description" content="AstroTools — suite de herramientas: nómina e IRPF, vivienda y ahorro. Calcula, planifica y decide mejor.">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/brand.js"></script>
<script src="shared/nav.js" defer></script>
<script src="shared/analytics.js" defer></script>
<style>
  .lang-sel{display:flex;gap:6px;justify-content:flex-end;margin-bottom:.4rem}
  .lang-sel button{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:inherit;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .15s}
  .lang-sel button:hover{border-color:var(--secondary);color:var(--secondary)}
  .lang-sel button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .hero{text-align:center;padding:1rem 0 2rem}
  .hero h1{font-size:2.2rem;margin:.2rem 0;color:var(--primary)}
  .hero h1 .dot{color:var(--accent)}
  .hero p{color:var(--text-muted);font-size:1.05rem;margin:.4rem auto;max-width:560px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.1rem;margin-top:1.5rem}
  .card h2{margin:.1rem 0 .35rem;font-size:1.15rem;color:var(--primary)}
  .card .tag{color:var(--text-muted);font-size:.92rem}
  .card .go{display:inline-block;margin-top:.9rem;font-weight:600;color:var(--secondary)}
  footer{text-align:center;color:var(--text-muted);font-size:.85rem;margin-top:2.5rem}
</style>
</head>
<body>
<astro-nav></astro-nav>
<div class="wrap">
  <div class="lang-sel">
    <button data-l="es" class="active" onclick="setLang('es')">ES</button>
    <button data-l="ca" onclick="setLang('ca')">CA</button>
    <button data-l="en" onclick="setLang('en')">EN</button>
  </div>
  <div class="hero">
    <h1>AstroTools<span class="dot">.</span></h1>
    <p id="subtitle"></p>
  </div>
  <div class="grid" id="apps"></div>
  <footer id="foot"></footer>
</div>
<script>
  var cfg = window.ASTROTOOLS;
  var T = {
    es: {
      title: "AstroTools · Tu suite de calculadoras",
      subtitle: "Una suite de calculadoras para tomar mejores decisiones con tu dinero.",
      open: "Abrir →",
      foot: "<strong>AstroTools</strong> es una app de AstroCosas",
      tag: { casa: "¿A qué casa puedes aspirar?", nomina: "Tu nómina e IRPF, mes a mes", ahorro: "Haz que tu dinero trabaje por ti" }
    },
    ca: {
      title: "AstroTools · La teva suite de calculadores",
      subtitle: "Una suite de calculadores per prendre millors decisions amb els teus diners.",
      open: "Obrir →",
      foot: "<strong>AstroTools</strong> és una app d'AstroCosas",
      tag: { casa: "A quina casa pots aspirar?", nomina: "La teva nòmina i IRPF, mes a mes", ahorro: "Fes que els teus diners treballin per tu" }
    },
    en: {
      title: "AstroTools · Your suite of calculators",
      subtitle: "A suite of calculators to make better decisions with your money.",
      open: "Open →",
      foot: "<strong>AstroTools</strong> is an AstroCosas app",
      tag: { casa: "What home can you afford?", nomina: "Your payslip and income tax, month by month", ahorro: "Make your money work for you" }
    }
  };

  function render(l) {
    var t = T[l] || T.es;
    document.title = t.title;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("foot").innerHTML = t.foot;
    document.getElementById("apps").innerHTML = cfg.apps.map(function (a) {
      return '<a class="card" href="' + a.href + '">' +
               '<h2>' + a.name + '</h2>' +
               '<div class="tag">' + (t.tag[a.id] || a.tagline) + '</div>' +
               '<span class="go">' + t.open + '</span>' +
             '</a>';
    }).join("");
  }

  window.setLang = function (l) {
    if (!T[l]) l = "es";
    document.documentElement.lang = l;
    var btns = document.querySelectorAll(".lang-sel button");
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("active", btns[i].getAttribute("data-l") === l);
    render(l);
  };

  render("es");
</script>
</body>
</html>
